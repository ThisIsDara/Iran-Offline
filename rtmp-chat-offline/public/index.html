<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0705">
    <meta name="description" content="Live stream chat">
    <title>Ember &mdash; Live Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================================================ join screen -->
<div id="login-modal" class="screen">
    <div class="join-card">
        <div class="brand brand--lg">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2c1.5 3 4.5 4.5 4.5 8a4.5 4.5 0 0 1-9 0c0-1.4.5-2.4 1.2-3.4.3 1.2 1 2 2 2.2C10 6.6 11 4 12 2Z"/>
                </svg>
            </span>
            <span class="brand-name">EMBER</span>
        </div>
        <p class="join-sub">Live stream chat</p>

        <form id="join-form" novalidate>
            <div class="field">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" name="username" placeholder="Pick a name"
                       maxlength="20" autocomplete="nickname" autocapitalize="off" spellcheck="false"
                       aria-describedby="username-error">
                <p class="field-error" id="username-error" role="alert"></p>
            </div>

            <div class="field">
                <label for="stream-input">Room</label>
                <input type="text" id="stream-input" name="room" placeholder="e.g. Kivi"
                       maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false"
                       aria-describedby="room-error">
                <p class="field-error" id="room-error" role="alert"></p>
            </div>

            <div class="field">
                <label id="color-label">Your colour</label>
                <div class="color-picker" id="color-picker" role="radiogroup" aria-labelledby="color-label"></div>
            </div>

            <button type="submit" class="btn btn--primary btn--block btn--lg" id="join-btn">
                Join chat
            </button>
        </form>

        <p class="welcome-msg" id="welcome-msg"></p>
    </div>
</div>

<!-- ============================================================ app -->
<div id="main-container" class="hidden">

    <header id="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2c1.5 3 4.5 4.5 4.5 8a4.5 4.5 0 0 1-9 0c0-1.4.5-2.4 1.2-3.4.3 1.2 1 2 2 2.2C10 6.6 11 4 12 2Z"/>
                </svg>
            </span>
            <span class="brand-name">EMBER</span>
        </div>

        <div class="topbar-room">
            <span class="room-name" id="room-name"></span>
            <span class="status-pill" id="live-pill" data-state="checking">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="live-pill-text">Checking</span>
            </span>
        </div>

        <div class="topbar-actions">
            <button class="icon-btn" id="users-btn" title="Who's here" aria-label="Who's here">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13A4 4 0 0 1 16 11"/>
                </svg>
                <span class="icon-btn-badge" id="user-count">0</span>
            </button>

            <button class="icon-btn" id="popout-chat-btn" title="Pop out chat" aria-label="Pop out chat">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                </svg>
            </button>

            <button class="icon-btn" id="transparent-btn" title="Overlay mode (for OBS)" aria-label="Overlay mode" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 14h20" stroke-dasharray="3 2"/>
                </svg>
            </button>

            <button class="icon-btn" id="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                </svg>
            </button>

            <button class="icon-btn icon-btn--danger" id="leave-btn" title="Leave chat" aria-label="Leave chat">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="body-grid">

        <!-- ------------------------------------------------------ video -->
        <section id="stream-section" aria-label="Stream">
            <div id="video-container">
                <div id="player-skeleton" aria-hidden="true">
                    <div class="skeleton-bar"></div>
                </div>
                <div id="player-overlay" class="hidden">
                    <div class="offline-card">
                        <span class="offline-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor"
                                 stroke-width="1.5" stroke-linecap="round">
                                <path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/>
                                <path d="M5 12.9a10 10 0 0 1 4-2.4"/><path d="M2 8.8a15 15 0 0 1 5-3"/>
                                <path d="M12 20h.01"/>
                            </svg>
                        </span>
                        <h2 id="offline-title">Stream offline</h2>
                        <p id="offline-text">Waiting for the streamer to go live&hellip;</p>
                        <button class="btn btn--primary" id="offline-retry">Check again</button>
                    </div>
                </div>
            </div>

            <div id="stream-bar">
                <button class="btn btn--ghost" id="refresh-btn">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                        <path d="M3 21v-5h5"/>
                    </svg>
                    Reload player
                </button>
                <button class="btn btn--ghost" id="copy-link-btn">Copy stream link</button>
                <span class="stream-hint" id="stream-hint"></span>
            </div>
        </section>

        <!-- ------------------------------------------------------ chat -->
        <section id="chat-container" aria-label="Chat">
            <div id="chat-header">
                <span class="chat-title">
                    Live chat
                    <span class="room-chip" id="room-chip"></span>
                </span>
                <span class="ws-status" id="ws-status" data-state="connecting" title="Connection status">
                    <span class="ws-dot" aria-hidden="true"></span>
                    <span id="ws-status-text">connecting</span>
                </span>
            </div>

            <div id="chat-messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <button id="scroll-bottom" class="hidden" title="Jump to latest">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>
                </svg>
                <span id="unread-badge" class="hidden">0</span>
            </button>

            <div id="users-popover" class="hidden" role="dialog" aria-label="People here">
                <div class="popover-head">People here <span id="users-total">0</span></div>
                <ul id="users-list"></ul>
            </div>

            <form id="chat-form" autocomplete="off">
                <div id="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="Send a message" maxlength="500"
                           aria-label="Message" disabled>
                    <button type="button" id="emoji-btn" title="Emoji" aria-label="Emoji" aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01"/><path d="M15 9.5h.01"/>
                        </svg>
                    </button>
                    <button type="submit" class="send-btn" id="send-btn" title="Send" aria-label="Send message" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4.5 12h15"/><path d="m12.5 5 7 7-7 7"/>
                        </svg>
                    </button>
                    <div class="dropdown" id="emoji-suggestions"></div>
                    <div class="dropdown" id="autocomplete-dropdown"></div>
                </div>
                <div id="emoji-picker" class="hidden" role="dialog" aria-label="Emoji picker"></div>
            </form>

            <div id="char-counter" class="hidden" aria-live="polite"></div>
        </section>
    </div>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

<!-- Only visible in overlay mode. Overlay mode hides the top bar, so this is
     the one control that must stay reachable or the mode is a one-way trip. -->
<button type="button" id="overlay-exit" class="overlay-exit hidden">
    Exit overlay &middot; Esc
</button>

<script src="app.js"></script>
</body>
</html>
